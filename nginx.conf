server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml application/manifest+json text/xml;

    # Hashed build assets never change.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Shared configs: one page for every code; it reads the code from the address.
    location ~ "^/config/myriad_[A-Za-z0-9]{6}/?$" {
        try_files /config/index.html =404;
    }

    # The docs as Markdown for language models (llms.txt, llms-full.txt, /docs/**.md).
    location ~ \.md$ {
        default_type text/markdown;
        charset utf-8;
        try_files $uri =404;
    }
    location ~ ^/llms(-full)?\.txt$ {
        default_type text/plain;
        charset utf-8;
        try_files $uri =404;
    }
    # Guessed addresses for the files above.
    location ~ ^/llms(-full)?/?$ {
        return 301 /llms$1.txt;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
